<!DOCTYPE html>
<html lang="th" translate="no">
<head>
    <meta name="google" content="notranslate">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Snack Management - สต็อกสินค้า</title>
    <link rel="icon" type="image/png" href="img/logo2.png">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <style>
        .stock-input {
            width: 80px;
            padding: 0.5rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            text-align: center;
        }
        .status-low { color: var(--danger); font-weight: bold; }
        .status-ok { color: var(--success); font-weight: bold; }
    </style>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SnackPOS">
    <link rel="apple-touch-icon" href="img/logo2.png">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="sidebar-header" style="padding: 1rem; text-align: center;">
                <img src="img/logo2.png" alt="บ.บูรณ์เจริญ" style="max-width: 100%; max-height: 120px; object-fit: contain;">
                <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 5px;">version 1.0</div>
            </div>
            <ul class="nav-links">
                <li><a href="dashboard.html"><i class="material-icons">dashboard</i> <span data-i18n="menu_dashboard">แดชบอร์ดสถิติ</span></a></li>
                <li><a href="index.html"><i class="material-icons">point_of_sale</i> <span data-i18n="menu_pos">หน้าขาย</span></a></li>
                <li><a href="products.html"><i class="material-icons">inventory_2</i> <span data-i18n="menu_products">จัดการสินค้า</span></a></li>
                <li><a href="categories.html"><i class="material-icons">category</i> <span data-i18n="menu_categories">หมวดหมู่</span></a></li>
                <li><a href="stock.html" class="active"><i class="material-icons">inventory</i> <span data-i18n="menu_stock">สต็อกสินค้า</span></a></li>
                <li><a href="history.html"><i class="material-icons">history</i> <span data-i18n="menu_history">ประวัติการขาย</span></a></li>
            </ul>
            
            <div style="margin-top: auto; padding: 1rem; text-align: center; color: var(--text-muted); font-size: 0.8rem; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 10px;">
                <button onclick="openSettingsModal()" class="no-print" style="width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border); background: white; box-shadow: var(--shadow-sm); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-main); transition: all 0.2s;" title="ตั้งค่า">
                    <i class="material-icons">settings</i>
                </button>
                Vibed by Aun Booncharoen
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <div class="admin-container">
                <div class="page-header" style="display: flex; justify-content: space-between; align-items: center;">
                    <h2>อัปเดตสต็อกสินค้า</h2>
                    <button class="btn btn-danger" onclick="resetAllStock()">
                        <i class="material-icons" style="margin-right: 5px; font-size: 1.2rem;">restart_alt</i> ล้างสต็อก (เป็น 0)
                    </button>
                </div>

                <div class="card p-4 mb-4 flex gap-4">
                    <div class="flex-1">
                        <input type="text" id="search-stock" class="form-control" placeholder="ค้นหาสินค้า...">
                    </div>
                    <div>
                        <select id="filter-status" class="form-control">
                            <option value="all">สินค้าทั้งหมด</option>
                            <option value="low">เฉพาะใกล้หมด (ต่ำกว่า 10)</option>
                            <option value="out">เฉพาะสินค้าหมด (0)</option>
                        </select>
                    </div>
                </div>

                <table class="data-table">
                    <thead>
                        <tr>
                            <th>รหัส</th>
                            <th>ชื่อสินค้า</th>
                            <th>สถานะ</th>
                            <th>สต็อกปัจจุบัน (ลัง)</th>
                            <th>อัปเดตสต็อก (+/- ลัง)</th>
                        </tr>
                    </thead>
                    <tbody id="stock-table-body">
                        <!-- Data -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="js/db.js"></script>
    <script src="js/stock.js"></script>
    <script src="js/i18n.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js');
        });
      }
    </script>
</body>
</html>
